name: UCI Luxe Cinema Schedule Monitor

on:
  schedule:
    # Run every 10 minutes (offset from top of hour to avoid queue delays)
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send test notification to verify delivery to your phone"
        required: false
        type: boolean
        default: true
      notify_existing:
        description: "Also alert on currently available IMAX OmU sessions"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # Needed to commit monitor_state.json back to repo

concurrency:
  group: cinema-monitor
  cancel-in-progress: false

jobs:
  check-schedule:
    name: Check UCI Luxe Schedule
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Browser & Cloudflare Bypass Engines
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Connect to Home WireGuard (FRITZ!Box)
        if: env.WIREGUARD_CONFIG != ''
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard resolvconf
          echo "$WIREGUARD_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          echo "Connected! Outbound residential IP via home FRITZ!Box:"
          curl -s https://ifconfig.me
          echo ""

      - name: Run UCI Schedule Monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'uci-luxe-odyssey-imax' }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER || 'https://ntfy.sh' }}
        run: |
          # 1. If manual trigger with test_notification requested, dispatch test alert
          if [ "${{ github.event.inputs.test_notification }}" = "true" ]; then
            echo "Dispatching test notification to ntfy topic: $NTFY_TOPIC..."
            python3 main.py --test-notify --ntfy-topic "$NTFY_TOPIC" --ntfy-server "$NTFY_SERVER"
          fi

          # 2. Build flags for schedule check
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.notify_existing }}" = "true" ]; then
            EXTRA_FLAGS="--notify-existing"
          fi

          echo "Running schedule check against UCI Kinowelt..."
          python3 main.py --once --no-desktop --ntfy-topic "$NTFY_TOPIC" --ntfy-server "$NTFY_SERVER" $EXTRA_FLAGS

      - name: Commit and Push Updated State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain monitor_state.json) ]]; then
            echo "State changed. Committing updated monitor_state.json..."
            git add monitor_state.json
            git commit -m "chore: update cinema monitor state"
            git push
          else
            echo "No state changes to commit."
          fi

      - name: Disconnect WireGuard
        if: always() && env.WIREGUARD_CONFIG != ''
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          sudo wg-quick down wg0 || true
