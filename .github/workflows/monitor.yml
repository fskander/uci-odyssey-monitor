name: UCI Luxe Cinema Schedule Monitor

on:
  schedule:
    # Run every 10 minutes (offset from top of hour to avoid queue delays)
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send test notification to verify delivery to your phone"
        required: false
        type: boolean
        default: false
      notify_existing:
        description: "Also alert on currently available IMAX OmU sessions"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # Needed to commit monitor_state.json back to repo

concurrency:
  group: cinema-monitor
  cancel-in-progress: false

jobs:
  check-schedule:
    name: Check UCI Luxe Schedule
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Check UCI Schedule via Home WireGuard
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'uci-luxe-odyssey-imax' }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER || 'https://ntfy.sh' }}
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          # 1. Connect WireGuard if configured
          if [ -n "$WIREGUARD_CONFIG" ]; then
            sudo apt-get install -y -qq wireguard resolvconf
            # Backup pristine system resolv.conf
            sudo cp /etc/resolv.conf /tmp/system_resolv.conf
            trap 'sudo wg-quick down wg0 2>/dev/null || true; sudo cp /tmp/system_resolv.conf /etc/resolv.conf 2>/dev/null || true' EXIT
            echo "$WIREGUARD_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
            sudo chmod 600 /etc/wireguard/wg0.conf
            sudo wg-quick up wg0
            echo "Connected via home FRITZ!Box: $(curl -s --max-time 5 https://ifconfig.me)"
          fi

          # 2. If manual trigger with test_notification requested, dispatch test alert
          if [ "${{ github.event.inputs.test_notification }}" = "true" ]; then
            echo "Dispatching test notification to ntfy topic: $NTFY_TOPIC..."
            python3 main.py --test-notify --ntfy-topic "$NTFY_TOPIC" --ntfy-server "$NTFY_SERVER"
          fi

          # 3. Build flags for schedule check
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.notify_existing }}" = "true" ]; then
            EXTRA_FLAGS="--notify-existing"
          fi

          echo "Running schedule check against UCI Kinowelt..."
          python3 main.py --once --no-desktop --ntfy-topic "$NTFY_TOPIC" --ntfy-server "$NTFY_SERVER" $EXTRA_FLAGS

          # 4. Disconnect WireGuard immediately & restore native system DNS
          if [ -n "$WIREGUARD_CONFIG" ]; then
            sudo wg-quick down wg0 || true
            sudo cp /tmp/system_resolv.conf /etc/resolv.conf || true
            echo "WireGuard disconnected & native DNS cleanly restored."
          fi

      - name: Commit and Push Updated State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain monitor_state.json) ]]; then
            echo "State changed. Committing updated monitor_state.json..."
            git add monitor_state.json
            git commit -m "chore: update cinema monitor state" || true
            for attempt in 1 2 3; do
              git push && break || true
              echo "Push rejected, syncing with remote (attempt $attempt)..."
              git pull --rebase -X theirs origin main || (git rebase --abort && git pull -X theirs origin main || true)
            done
          else
            echo "No state changes to commit."
          fi
